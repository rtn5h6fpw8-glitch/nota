<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Note</title>
<meta name="description" content="Бесплатная музыка со всего мира: артисты и альбомы Audius и Internet Archive, интернет-радио и ваши файлы.">
<meta name="theme-color" content="#000000">
<script>(function () { var d = document.documentElement, k, st = {}; try { k = JSON.parse(localStorage.getItem('nota:skin')); st = JSON.parse(localStorage.getItem('nota:settings')) || {}; } catch (e) {} if (k === 'auto') k = matchMedia('(prefers-color-scheme: light)').matches ? 'classic' : 'noir'; d.dataset.skin = ['noir', 'classic', 'aurora'].indexOf(k) > -1 ? k : 'noir'; if (st.glass === false) d.classList.add('no-glass'); if (st.motion === false) d.classList.add('no-motion'); })();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Note">
<link rel="preconnect" href="https://api.audius.co" crossorigin>
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="preconnect" href="https://de1.api.radio-browser.info" crossorigin>
<link rel="preconnect" href="https://cdn-images.dzcdn.net">
<link rel="dns-prefetch" href="https://api.deezer.com">
<link rel="dns-prefetch" href="https://cdnt-preview.dzcdn.net">
<link rel="dns-prefetch" href="https://creatornode.audius.co">
<link rel="modulepreload" href="app.js">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs" aria-label="Разделы">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span class="wordmark">Note</span></div>
  <div class="tab-group lg-glass">
  <i class="tab-drop" aria-hidden="true"></i>
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3.2 3 10v10.3c0 .4.3.7.7.7H9v-6.5h6V21h5.3c.4 0 .7-.3.7-.7V10z"/></svg><span>Главная</span></a>
  <a href="#browse" data-tab="browse"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>Обзор</span></a>
  <a href="#radio" data-tab="radio"><svg viewBox="0 0 24 24"><path d="M12 9.6a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 0 1 0-4.8zM7 6.2l1.4 1.4a6.2 6.2 0 0 0 0 8.8L7 17.8a8.2 8.2 0 0 1 0-11.6zm10 0a8.2 8.2 0 0 1 0 11.6l-1.4-1.4a6.2 6.2 0 0 0 0-8.8zM4.2 3.4l1.4 1.4a10.2 10.2 0 0 0 0 14.4l-1.4 1.4a12.2 12.2 0 0 1 0-17.2zm15.6 0a12.2 12.2 0 0 1 0 17.2l-1.4-1.4a10.2 10.2 0 0 0 0-14.4z"/></svg><span>Радио</span></a>
  <a href="#library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 3.5h2.2v17H4zm4.4 0h2.2v17H8.4zm4.6.9 2.1-.7 5.4 16.2-2.1.7z"/></svg><span>Медиатека</span></a>
  </div>
  <a class="tab-search lg-glass" href="#search" data-tab="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6 12l4.8 4.8-1.5 1.5-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2.1a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8z"/></svg><span>Поиск</span></a>
</nav>

<div class="topnav" id="topnav" aria-hidden="true"><span id="topnavTitle"></span></div>
<main id="view" tabindex="-1"></main>

<div class="mini lg-glass" id="mini" hidden>
  <button class="mini-open" id="miniOpen" aria-label="Открыть плеер">
    <span class="mini-art"><img id="miniArt" alt="" onload="this.classList.add('in')"></span>
    <span class="mini-text"><b id="miniTitle"></b><small id="miniArtist"></small><small id="miniLyric" class="mini-lyric" hidden></small></span>
  </button>
  <button class="ctl" id="miniPlay" aria-label="Играть"></button>
  <button class="ctl" id="miniNext" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M3.5 5.6v12.8c0 .8.9 1.2 1.5.7l7.6-6.4c.4-.4.4-1 0-1.4L5 4.9c-.6-.5-1.5-.1-1.5.7zm9 0v12.8c0 .8.9 1.2 1.5.7l7.6-6.4c.4-.4.4-1 0-1.4L14 4.9c-.6-.5-1.5-.1-1.5.7z"/></svg></button>
  <div class="mini-progress"><i id="miniBar"></i></div>
</div>

<section class="player" id="player" hidden aria-label="Сейчас играет">
  <div class="player-bg" id="playerBg"><canvas class="blob b1" width="24" height="24"></canvas><canvas class="blob b2" width="24" height="24"></canvas><canvas class="blob b3" width="24" height="24"></canvas></div>
  <div class="player-inner">
    <button class="grabber" id="playerClose" aria-label="Свернуть плеер"><span></span></button>
    <div class="stage" id="stage"><img id="bigArt" alt="" onload="this.classList.add('in')"></div>
    <div class="lyrics" id="lyrics" hidden><div class="lyr-inner" id="lyrInner"></div></div>
    <div class="now">
      <div class="now-text"><h2 id="bigTitle"></h2><button id="bigArtist" class="now-artist"></button></div>
      <button class="now-btn" id="bigLike" aria-label="В избранное"></button>
      <button class="now-btn" id="bigMore" aria-label="Ещё"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
    </div>
    <p class="big-lyric" id="bigLyric"></p>
    <div class="seek" id="seekWrap">
      <div class="seekbar" id="seek" role="slider" tabindex="0" aria-label="Позиция" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="seek-bubble" id="seekBubble">0:00</span><div class="seek-track"><div class="seek-fill" id="seekFill"></div></div></div>
      <div class="times"><span id="tCur">0:00</span><span id="tLive" hidden>Прямой эфир</span><span id="tDur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="ctl side" id="shuffle" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M16.6 3.6 20.5 7.5l-3.9 3.9V8.6h-2.2l-7.1 8.1H3.5v-2h2.9l7.1-8.1h3.1zm0 9.4 3.9 3.9-3.9 3.9v-2.8h-3.1l-2.4-2.7 1.4-1.6 1.9 2.2h2.2zM3.5 6.3h3.8l2.5 2.8-1.4 1.6-2-2.4H3.5z"/></svg></button>
      <button class="ctl big" id="prev" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M20.5 5.6v12.8c0 .8-.9 1.2-1.5.7l-7.6-6.4a.9.9 0 0 1 0-1.4L19 4.9c.6-.5 1.5-.1 1.5.7zm-9 0v12.8c0 .8-.9 1.2-1.5.7l-7.6-6.4a.9.9 0 0 1 0-1.4L10 4.9c.6-.5 1.5-.1 1.5.7z"/></svg></button>
      <button class="ctl huge" id="play" aria-label="Играть"></button>
      <button class="ctl big" id="next" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M3.5 5.6v12.8c0 .8.9 1.2 1.5.7l7.6-6.4c.4-.4.4-1 0-1.4L5 4.9c-.6-.5-1.5-.1-1.5.7zm9 0v12.8c0 .8.9 1.2 1.5.7l7.6-6.4c.4-.4.4-1 0-1.4L14 4.9c-.6-.5-1.5-.1-1.5.7z"/></svg></button>
      <button class="ctl side" id="repeat" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 6.5h10.5V4l3.5 3.5-3.5 3.5V8.5H7a2 2 0 0 0-2 2V12H3v-1.5a4 4 0 0 1 4-4zm10 11H6.5V20L3 16.5 6.5 13v2.5H17a2 2 0 0 0 2-2V12h2v1.5a4 4 0 0 1-4 4z"/></svg></button>
    </div>
    <div class="volume" id="volumeRow">
      <svg viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/></svg>
      <input type="range" id="volume" min="0" max="100" value="100" aria-label="Громкость">
      <svg viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4zm11.5-1.8a6 6 0 0 1 0 9.6l-1.2-1.6a4 4 0 0 0 0-6.4zm2.6-3.1a10 10 0 0 1 0 15.8l-1.2-1.6a8 8 0 0 0 0-12.6z"/></svg>
    </div>
    <div class="p-bottom">
      <button class="pb" id="lyricsBtn" aria-label="Текст песни"><svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7.5L7 21v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2.5 4.5v2h3.6c-.2 1.3-.9 2.1-2.1 2.6l.6 1.6c2.2-.8 3.4-2.6 3.4-5.2v-1zm6 0v2h3.6c-.2 1.3-.9 2.1-2.1 2.6l.6 1.6c2.2-.8 3.4-2.6 3.4-5.2v-1z"/></svg></button>
      <button class="pb" id="sleepBtn" aria-label="Таймер сна"><svg viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5z"/></svg></button>
      <button class="pb" id="queueBtn" aria-label="Далее в очереди"><svg viewBox="0 0 24 24"><path d="M3 5h13v2H3zm0 6h13v2H3zm0 6h9v2H3zm15-2.5V9l4 3.2z"/></svg></button>
    </div>
    <div class="queue-wrap">
      <div class="queue-head"><h3>Далее</h3><button class="text-btn" id="clearQueue">Очистить</button></div>
      <ol class="queue" id="queue"></ol>
    </div>
  </div>
</section>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head" id="sheetHead"><h3 id="sheetTitle"></h3></div>
    <div id="sheetBody"></div>
    <button class="sheet-cancel" id="sheetCancel">Отмена</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="filePick" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.cue" multiple hidden>
<input type="file" id="folderPick" webkitdirectory directory multiple hidden>
<audio id="audio" preload="metadata" playsinline></audio>

<script type="module" src="app.js"></script>
</body>
</html>
